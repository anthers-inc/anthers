# Watch for silent deploy drift: the push to `release` succeeded, nothing deployed.
#
# `deploy_on_push` is false on every App Platform component, so the CI `deploy` job
# in `ci.yml` is the only path to production. When it does not run — Actions billing
# failed, an upstream job failed, the `images` job hit a Dockerfile error — the
# push to `release` reports green and prod keeps serving the old build. Git success
# is indistinguishable from deploy success, and the only reliable detection is
# asserting the live deployment's `source_commit_hash` against `release`. That
# happened twice in one day on 2026-08-14 and was caught each time by a human
# reading stale copy on the live site, which is the failure mode this workflow
# exists to make loud.
#
# What this is NOT: a health check. It does not care whether the app is serving
# 200s, only whether the commit prod is running matches the commit `release`
# points at. A healthy app serving a stale build is the silent-deploy failure;
# an unhealthy app serving the right build is a different incident.
#
# It also sweeps for EMPTY PRODUCTION SECRETS (added 2026-08-15). Same family of
# failure and the same reason it needs a schedule: `doctl apps update --spec
# .do/app.yaml` emptied all seven app-level secrets in one command, and because an
# empty secret round-trips as a well-formed EV[1:...] blob, nothing reported it —
# `spec get` looked intact, `make spec-diff` said the specs agreed, and only the two
# secrets validated at boot produced any symptom at all. That check exists now, but
# a check nobody runs is a check that does not exist, and `make spec-diff` cannot
# join `make verify` (CI has no DigitalOcean token for the general suite). This is
# the one job that already holds the token and already runs on a clock.
#
# Runs hourly. A drift window of an hour is the compromise between "the deploy job
# is still running" (a fresh release push takes ~5 min to build on App Platform,
# so don't alert in the first 10 min after a push) and "prod is stale for a day
# and nobody notices" (the actual 2026-08-14 case, which is too long). The
# `ci.yml` deploy job also asserts the live SHA after its own deploy completes,
# so this catches the cases where that job never ran at all.
#
# Alert channel: a failing workflow run, deliberately. Issues are disabled on this
# repo as part of the source-available-no-community-surface posture, and a red
# Actions run reaches the same human via GitHub's own Actions-failure email
# without introducing a new notification path. A failing run is also self-documenting
# in the Actions UI — anyone looking at the repo sees the watcher is red.
name: deploy-watch

on:
  schedule:
    # Hourly, at :15, to avoid the top-of-the-hour pile-up every cron job aims at.
    # `ci.yml`'s deploy runs on push, not schedule, so there is no collision here.
    - cron: "15 * * * *"
  # Manual trigger for testing and for "check now after a push that should have deployed"
  workflow_dispatch:

# `issues: write` would be the scoped permission for an issue-based alert path,
# but issues are disabled on this repo. No elevated permissions are needed: the
# run fails on drift, and that failure is the alert.
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          # `deploy-status.ts` reads `release` via `git rev-parse`; without a fetch
          # the checkout only holds the scheduled-run default branch. We need
          # `origin/release` specifically, which is what App Platform builds from.
          fetch-depth: 0

      # 🚨 Both of these were MISSING until 2026-08-15, and the workflow had therefore
      # never once produced a valid signal: every scheduled run died on `bun: command
      # not found` (exit 127). Because a red run IS the alert channel here, the watcher
      # was crying wolf from the hour it was added — and a genuine drift would have been
      # indistinguishable from the broken setup. A watchdog whose failure mode looks
      # exactly like its alarm is worse than no watchdog.
      #
      # Neither step needs `bun install`: `deploy-status.ts` and `spec-diff.ts` use only
      # Bun built-ins (`Bun.$`, `Bun.YAML`, `Bun.spawn`), so the run stays dependency-free.
      - uses: oven-sh/setup-bun@v2
        # No bun-version ON PURPOSE — setup-bun reads `packageManager` from package.json,
        # matching ci.yml so the two cannot drift onto different runtimes.

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # ⚠️ No DOCTL_CONTEXT here, deliberately. `action-doctl` authenticates into doctl's
      # `default` context, so the `DOCTL_CONTEXT: anthers` this workflow used to set would
      # make every call fail on an unknown context the moment bun existed to run them —
      # the second bug waiting behind the first. The token already scopes to the Anthers
      # account; the context name is a LOCAL convenience for a machine holding two logins.
      # Exit 3 means "live matches release, but release is behind main" — merged work that
      # was never promoted. That is worth SAYING and not worth alarming on: promoting is a
      # deliberate act, so failing the run would put this workflow in a permanent red state
      # during ordinary development, and a watcher that cries wolf gets muted. This one
      # already spent its first day doing exactly that for a different reason.
      #
      # It surfaces as a GitHub annotation instead, which shows on the run without failing it.
      - name: Check the live deployment against release
        env:
          DO_APP_ID: ${{ vars.DO_APP_ID }}
          REF: origin/release
          PROMOTE_FROM: origin/main
        run: |
          set +e
          bun run scripts/deploy-status.ts
          code=$?
          if [ "$code" -eq 3 ]; then
            echo "::notice::release is behind main — merged work is not in production (not a deploy fault)"
            exit 0
          fi
          exit "$code"

      # Separate step, and it runs even when the drift check above failed: the two answer
      # unrelated questions ("is prod the right commit" / "does prod still have its
      # credentials"), and skipping the second because the first was red would hide the
      # more urgent one behind the less urgent one.
      #
      # `--secrets-only` rather than the full diff ON PURPOSE. The committed spec drifts
      # from live by default and is meant to — pushing to `release` never applies it — so
      # an hourly alarm on ordinary drift would be red most weeks and get muted, taking
      # this check down with it. An empty live secret is never expected and never benign.
      - name: Check that no live secret is empty
        if: '!cancelled()'
        env:
          DO_APP_ID: ${{ vars.DO_APP_ID }}
        run: bun run scripts/spec-diff.ts --secrets-only
      # Storage CORS is a Cloudflare dashboard setting with no representation in this repo,
      # so nothing here can review it and a change leaves no diff. That is exactly how
      # `www.anthers.org` came to be missing from the bucket allowlist: every server-side
      # path worked, and the only broken thing was a browser PUT from one of our two
      # hostnames. It went unnoticed until someone probed it by hand.
      #
      # This needs NO credentials — a preflight is an unauthenticated OPTIONS, and the
      # non-secret STORAGE_* values come from the committed spec — so unlike the two steps
      # above it costs nothing to run and cannot leak anything. Exit 2 (unreachable) is
      # mapped to a notice rather than a failure, for the same reason the drift check maps
      # its own "cannot determine" case: a bad minute on the network is not a finding about
      # our configuration, and a check that cries wolf gets muted along with everything
      # else in this workflow.
      - name: Storage CORS still admits the site (and refuses everything else)
        if: '!cancelled()'
        run: |
          set +e
          bun run apps/api/scripts/storage-posture.ts --cors-only
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::notice::storage CORS could not be determined (network or R2 unreachable)"
            exit 0
          fi
          exit "$code"
