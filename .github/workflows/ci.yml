name: ci

# `release` is here because it is the branch App Platform actually deploys, and
# nothing was watching it. Note what this does and doesn't buy: `deploy_on_push`
# is true on every component, so App Platform starts building the moment the push
# lands and GitHub Actions cannot hold it back. What running here gives us is a
# green/red mark against the exact SHA being deployed — which matters because
# `release` can be pushed from somewhere other than a fast-forward of `main`
# (a hotfix branch, a cherry-pick), and that push would otherwise be the first
# time the code was ever checked.
#
# The ordinary deploy, though, is a fast-forward of a SHA `main` just tested, and
# re-running the whole suite against identical code buys nothing while adding a
# second set of checks to the same commit — GitHub attaches them to the SHA, not
# the branch, so a flake in the duplicate paints a commit that passed. The
# `precheck` job below skips the release run in exactly that case and no other;
# see its comment.
#
# **This IS a true gate now** (2026-08-09), which reverses the note that stood
# here: `deploy_on_push` is false on every component and the `deploy` job at the
# bottom is the only path to production. It was deferred on 2026-08-08 on the
# grounds that a failed build cannot take prod down anyway — App Platform keeps
# the previously-active deployment serving — and that reasoning was sound but
# answered a different question. The gate does not buy "prod cannot break"; it
# buys "nothing untested ever reaches prod", which is worth having in place
# before launch rather than during it.
#
# What it costs, and know this before an incident: a red run now blocks a hotfix
# too. The escape hatch is `doctl apps create-deployment <app-id>` by hand, which
# is deliberately not wrapped in a make target — bypassing the gate should take a
# moment's thought.
on:
  push:
    branches: [main, release]
  pull_request:

jobs:
  # Has this exact commit already passed on `main`?
  #
  # A deploy fast-forwards `release` to a SHA that `main` has just tested, so the push
  # triggers a SECOND full run of the same code. That buys nothing and costs something
  # real: checks attach to a SHA rather than a branch, so a flake in the duplicate run
  # paints a red mark on a commit that passed — twice now that has cost someone the time
  # to decode a failure that meant nothing, which is how a team learns to ignore CI.
  #
  # So the release run is skipped when, and only when, this SHA already has a green `ci`
  # run on `main`. What that deliberately preserves is the case the release trigger was
  # added for: a `release` push that is NOT a fast-forward of `main` — a hotfix branch, a
  # cherry-pick — has no such run, so it is tested in full. A run still in progress on
  # `main` counts as "not passed", which errs toward running twice rather than not at all.
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only ever skip a push to release. PRs and main pushes always run.
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_name }}" != "release" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Not a release push — running in full."
            exit 0
          fi
          passed=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&branch=main&status=success" \
            --jq '.total_count' 2>/dev/null || echo 0)
          if [ "${passed:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ github.sha }} already passed ci on main — skipping the duplicate release run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No green ci run for ${{ github.sha }} on main — testing this release push in full."
          fi

  # Static checks + the Bun test suites (API routes, jobs, and the shared money/
  # attention policy). Deliberately its own job with its own database rather than a
  # step in `playwright`: the two suites then share no state, run in parallel, and
  # report independently — a red API suite isn't hidden behind a browser failure.
  # It also skips the Chromium download, and avoids both suites wanting port 8000.
  test:
    needs: precheck
    if: needs.precheck.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: anthers
          POSTGRES_PASSWORD: anthers
          POSTGRES_DB: anthers
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anthers -d anthers"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://anthers:anthers@localhost:5432/anthers

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        # No bun-version here ON PURPOSE. setup-bun reads `packageManager` from
        # package.json, so the repo declares the runtime once and CI follows it —
        # rather than CI carrying a second copy that can drift from what developers run.
        #
        # It used to say `latest`, which meant every run depended on whatever Bun
        # shipped that day AND on an api.github.com call to resolve it. Bun 1.3.14
        # segfaults our API under the Playwright webServer (`panic(main thread):
        # Segmentation fault at address 0x0` at 0.2GB RSS on an 8GB machine — a Bun
        # bug, not resource exhaustion), which took main red on 2026-08-04 against a
        # diff that was green locally. Bump the version in package.json, deliberately.

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Typecheck was previously enforced only by the App Platform build, which means
      # a type error surfaced at deploy time rather than on the PR that caused it.
      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Published money figures are generated from fees.ts, never typed. This fails if
      # a dial or formula changed without regenerating — the drift that put a wrong
      # remainder in the economics doc for five days after the 2026-08-03 revamp.
      - name: Economics figures are in sync
        run: bun run econ:figures --check

      - name: Apply database migrations
        run: bun run db:migrate

      # The suites drive the Hono app through `app.fetch` against this real Postgres.
      - name: Run test suites
        run: bun test

  # The two Docker images App Platform builds at deploy time. Nothing else in CI
  # exercises them, and that gap is exactly how `bcd212e` shipped: adding
  # `apps/studio-desktop` as a workspace changed `bun.lock`, neither Dockerfile
  # COPY'd its `package.json`, and `bun install --frozen-lockfile` failed inside
  # both images. Prod kept serving the previous deployment so there was no outage,
  # but nothing local or in CI could have caught it — PR #52 did the identical
  # thing when `apps/studio` was added. Building here turns "remember to add the
  # manifest" into a check.
  #
  # Build only — nothing is pushed to a registry. App Platform builds its own
  # images from the same Dockerfiles; this proves they build, not what ships.
  images:
    needs: precheck
    if: needs.precheck.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # Both images share the workspace-manifest failure mode, so when it strikes
      # it strikes both. Seeing both fail is the signal that it's the lockfile and
      # not something specific to one image.
      fail-fast: false
      matrix:
        include:
          # Serves api, worker, and the PRE_DEPLOY migrate job — one image, three
          # components, distinguished only by run_command in .do/app.yaml.
          - name: api
            dockerfile: apps/api/Dockerfile
          # The separate `anthers-studio` app. Its App Platform spec exists only in
          # App Platform, not in this repo, so this is the only place in version
          # control where that deployment gets checked at all.

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          # Scoped per image so the two don't evict each other's layers.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  playwright:
    needs: precheck
    if: needs.precheck.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The User Gauntlet spec needs the real API + Postgres behind the preview SPA
    # (see apps/web/playwright.config.ts webServer). Mirrors compose.yaml's dev database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: anthers
          POSTGRES_PASSWORD: anthers
          POSTGRES_DB: anthers
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anthers -d anthers"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://anthers:anthers@localhost:5432/anthers

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        # No bun-version here ON PURPOSE. setup-bun reads `packageManager` from
        # package.json, so the repo declares the runtime once and CI follows it —
        # rather than CI carrying a second copy that can drift from what developers run.
        #
        # It used to say `latest`, which meant every run depended on whatever Bun
        # shipped that day AND on an api.github.com call to resolve it. Bun 1.3.14
        # segfaults our API under the Playwright webServer (`panic(main thread):
        # Segmentation fault at address 0x0` at 0.2GB RSS on an 8GB machine — a Bun
        # bug, not resource exhaustion), which took main red on 2026-08-04 against a
        # diff that was green locally. Bump the version in package.json, deliberately.

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      # The gauntlet fixture generates a short clip and runs it through the real transcode
      # job, so the walk can assert delivered bytes rather than access reasons. Without
      # ffmpeg that step no-ops and those assertions silently skip — which is exactly the
      # kind of quiet coverage loss the gauntlet exists to prevent, so install it rather
      # than trusting whatever the runner image happens to ship.
      - name: Ensure ffmpeg
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Apply database migrations
        run: bun run db:migrate

      - name: Run e2e tests
        working-directory: apps/web
        env:
          CI: "true"
        run: bunx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ─── The deploy gate ──────────────────────────────────────────────────────────
  #
  # This is what makes CI authoritative instead of advisory. `deploy_on_push` is now
  # false on every component, so App Platform builds nothing on its own and this job is
  # the only path to production.
  #
  # The `if` is the whole design, and it is not `needs: [test, images]` alone — that
  # would be wrong in the ORDINARY case. `precheck` skips the test jobs when this exact
  # SHA already passed on `main`, and a `needs` on a skipped job skips its dependents
  # too, so the common deploy would never fire. What this asserts instead is the honest
  # condition: nothing failed, and nothing was cancelled. A skipped suite reaches here
  # only via precheck, which skips only after confirming a green run on the same SHA.
  #
  # `!cancelled()` rather than `success()` for the same reason: `success()` requires
  # every dependency to have succeeded, which a deliberate skip is not.
  deploy:
    needs: [precheck, test, images, playwright]
    if: >-
      github.event_name == 'push' && github.ref_name == 'release' &&
      !cancelled() && !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Two deploys of the same app at once is a race App Platform resolves by superseding
    # one, which makes the losing run's green mark a lie. Serialize instead, and never
    # cancel one in flight — an interrupted deploy is the one state worse than a slow one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Deploy ${{ github.sha }}
        run: |
          set -o pipefail
          echo "::notice::Deploying ${{ github.sha }} to production"
          # --wait blocks until the deployment settles, so this job is red when the build
          # fails rather than green-on-submitted. App Platform keeps the previously-active
          # deployment serving throughout, so a failure here leaves prod on the last good
          # build rather than down.
          doctl apps create-deployment ${{ vars.DO_APP_ID || '5fa8af5d-e94f-400e-8dd6-e1377fb1a7ee' }} \
            --wait --format ID,Phase

      - name: Report what is now live
        if: ${{ !cancelled() }}
        run: |
          doctl apps list-deployments ${{ vars.DO_APP_ID || '5fa8af5d-e94f-400e-8dd6-e1377fb1a7ee' }} \
            --format ID,Cause,Phase | head -3
