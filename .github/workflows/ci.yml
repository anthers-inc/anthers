name: ci

# `release` is here because it is the branch App Platform actually deploys, and
# nothing was watching it. Note what this does and doesn't buy: `deploy_on_push`
# is true on every component, so App Platform starts building the moment the push
# lands and GitHub Actions cannot hold it back. What running here gives us is a
# green/red mark against the exact SHA being deployed — which matters because
# `release` can be pushed from somewhere other than a fast-forward of `main`
# (a hotfix branch, a cherry-pick), and that push would otherwise be the first
# time the code was ever checked.
#
# The ordinary deploy, though, is a fast-forward of a SHA `main` just tested, and
# re-running the whole suite against identical code buys nothing while adding a
# second set of checks to the same commit — GitHub attaches them to the SHA, not
# the branch, so a flake in the duplicate paints a commit that passed. The
# `precheck` job below skips the release run in exactly that case and no other;
# see its comment.
#
# **This IS a true gate now** (2026-08-09), which reverses the note that stood
# here: `deploy_on_push` is false on every component and the `deploy` job at the
# bottom is the only path to production. It was deferred on 2026-08-08 on the
# grounds that a failed build cannot take prod down anyway — App Platform keeps
# the previously-active deployment serving — and that reasoning was sound but
# answered a different question. The gate does not buy "prod cannot break"; it
# buys "nothing untested ever reaches prod", which is worth having in place
# before launch rather than during it.
#
# What it costs, and know this before an incident: a red run now blocks a hotfix
# too. The escape hatch is `doctl apps create-deployment <app-id>` by hand, which
# is deliberately not wrapped in a make target — bypassing the gate should take a
# moment's thought.
on:
  push:
    branches: [main, release]
  pull_request:

jobs:
  # Has this code already been tested?
  #
  # Every push here is preceded by a run against the same work, twice over. A deploy
  # fast-forwards `release` to a SHA `main` has just tested; a squash merge lands a tree
  # a pull request has just tested. Both re-run the whole suite against code nothing has
  # changed, and that buys nothing while costing something real: checks attach to a SHA
  # rather than a branch, so a flake in the duplicate paints a red mark on work that
  # passed — twice now that has cost someone the time to decode a failure that meant
  # nothing, which is how a team learns to ignore CI.
  #
  # 🚨 **The two cases need different keys, and getting that wrong is how a dedupe starts
  # skipping things it should not.** A fast-forward preserves the SHA, so `release` can
  # ask about the commit. A squash merge does not, so `main` has to ask about the **tree**
  # — which is the whole of what a test run examines, and which differs the moment `main`
  # moves under an open pull request. That difference is not an inconvenience: it is
  # exactly the case where re-running is the only thing that catches a semantic conflict
  # two independently-green branches produce together.
  #
  # A run still in progress counts as "not passed" in both cases, which errs toward
  # running twice rather than not at all. A `release` push that is not a fast-forward —
  # a hotfix branch, a cherry-pick — and a direct push to `main` both run in full, which
  # is the case the `release` trigger was added for in the first place.
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci-precheck.sh
          sparse-checkout-cone-mode: false
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: ./scripts/ci-precheck.sh

  # Static checks + the Bun test suites (API routes, jobs, and the shared money/
  # attention policy). Deliberately its own job with its own database rather than a
  # step in `playwright`: the two suites then share no state, run in parallel, and
  # report independently — a red API suite isn't hidden behind a browser failure.
  # It also skips the Chromium download, and avoids both suites wanting port 8000.
  test:
    needs: precheck
    if: needs.precheck.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: anthers
          POSTGRES_PASSWORD: anthers
          POSTGRES_DB: anthers
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anthers -d anthers"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://anthers:anthers@localhost:5432/anthers

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        # No bun-version here ON PURPOSE. setup-bun reads `packageManager` from
        # package.json, so the repo declares the runtime once and CI follows it —
        # rather than CI carrying a second copy that can drift from what developers run.
        #
        # It used to say `latest`, which meant every run depended on whatever Bun
        # shipped that day AND on an api.github.com call to resolve it. Bun 1.3.14
        # segfaults our API under the Playwright webServer (`panic(main thread):
        # Segmentation fault at address 0x0` at 0.2GB RSS on an 8GB machine — a Bun
        # bug, not resource exhaustion), which took main red on 2026-08-04 against a
        # diff that was green locally. Bump the version in package.json, deliberately.

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Typecheck was previously enforced only by the App Platform build, which means
      # a type error surfaced at deploy time rather than on the PR that caused it.
      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Published money figures are generated from fees.ts, never typed. This fails if
      # a dial or formula changed without regenerating — the drift that put a wrong
      # remainder in the economics doc for five days after the 2026-08-03 revamp.
      - name: Economics figures are in sync
        run: bun run econ:figures --check

      # A published Lexicon is a public API commitment, so the generated types drifting
      # from the JSON that defines them is not a formatting nit — it means the schema and
      # the code disagree about something other people may already be consuming.
      - name: Lexicon types are in sync
        run: bun run lex:check

      # A hand-written migration that skips drizzle's snapshot makes its view of the
      # schema permanently stale, and the symptom is a rename prompt that reads like an
      # ordinary question. Nothing else can see it: typecheck passes, tests pass, and the
      # database is correct — the only artefact that disagrees is a JSON file nobody reads.
      - name: Drizzle snapshots are in step with the journal
        run: bun run db:snapshots

      - name: Apply database migrations
        run: bun run db:migrate

      # The suites drive the Hono app through `app.fetch` against this real Postgres.
      - name: Run test suites
        run: bun test

  # The two Docker images App Platform builds at deploy time. Nothing else in CI
  # exercises them, and that gap is exactly how `bcd212e` shipped: adding
  # a workspace change to `bun.lock`, neither Dockerfile
  # COPY'd its `package.json`, and `bun install --frozen-lockfile` failed inside
  # both images. Prod kept serving the previous deployment so there was no outage,
  # but nothing local or in CI could have caught it — PR #52 did the identical
  # thing when `apps/studio` was added. Building here turns "remember to add the
  # manifest" into a check.
  #
  # Build only — nothing is pushed to a registry. App Platform builds its own
  # images from the same Dockerfiles; this proves they build, not what ships.
  images:
    needs: precheck
    if: needs.precheck.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # Both images share the workspace-manifest failure mode, so when it strikes
      # it strikes both. Seeing both fail is the signal that it's the lockfile and
      # not something specific to one image.
      fail-fast: false
      matrix:
        include:
          # Serves api, worker, and the PRE_DEPLOY migrate job — one image, three
          # components, distinguished only by run_command in .do/app.yaml.
          - name: api
            dockerfile: apps/api/Dockerfile
          # The separate `anthers-studio` app (deleted 2026-08-11). Its spec existed only in
          # App Platform, not in this repo, so this is the only place in version
          # control where that deployment gets checked at all.

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          # Scoped per image so the two don't evict each other's layers.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ─── The browser suite, in two halves ────────────────────────────────────────
  #
  # 🚨 **The split is by SYSTEM DEPENDENCY, not by speed or by importance.** The suite used
  # to be one job that `apt-get install`ed ffmpeg and poppler on every run — 30 seconds on a
  # good day, and an unbounded tail: it blew the 15-minute job timeout twice in two days
  # against a stalled `azure.archive.ubuntu.com`, once inside `--with-deps` (removed by #34)
  # and once fetching 13.6 MB of `libflite1`. #34 closed the instance and left the class,
  # which is *assembling a runner from Ubuntu mirrors on every run*.
  #
  # So the half that needs nothing from a mirror now runs on a bare runner and cannot fail
  # for infrastructure reasons at all, and the half that genuinely needs media tools runs in
  # an image that already has them (`.github/ci-image/`). Neither half lost coverage; a
  # mirror outage can now only take out the half that actually depends on one.
  #
  # ⚠️ **Which project belongs to which job is NOT written here.** It is `metadata.needsMedia`
  # in `apps/web/playwright.config.ts`, and `scripts/e2e-projects.ts` derives both command
  # lines from it. Playwright 1.61 has no `--project` negation, so a job can only name
  # projects — two hand-kept lists here would mean a project added later runs in NEITHER job
  # while both stay green, which is the quiet coverage loss this repo keeps meeting in other
  # shapes. The script fails loudly on a project that declares no flag.
  browser:
    needs: precheck
    if: needs.precheck.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    # Still needed, and worth being clear why when the point of this job is "no external
    # dependencies": the specs drive the real API (see playwright.config.ts webServer), which
    # does not boot without a database. A service container is pulled from GHCR and is not
    # the fragile thing — apt was.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: anthers
          POSTGRES_PASSWORD: anthers
          POSTGRES_DB: anthers
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anthers -d anthers"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://anthers:anthers@localhost:5432/anthers

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        # No bun-version here ON PURPOSE. setup-bun reads `packageManager` from
        # package.json, so the repo declares the runtime once and CI follows it —
        # rather than CI carrying a second copy that can drift from what developers run.
        #
        # It used to say `latest`, which meant every run depended on whatever Bun
        # shipped that day AND on an api.github.com call to resolve it. Bun 1.3.14
        # segfaults our API under the Playwright webServer (`panic(main thread):
        # Segmentation fault at address 0x0` at 0.2GB RSS on an 8GB machine — a Bun
        # bug, not resource exhaustion), which took main red on 2026-08-04 against a
        # diff that was green locally. Bump the version in package.json, deliberately.

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 🚨 NOT `--with-deps`, and the browser download was never the expensive half.
      # Measured on the 2026-08-17 release run, which blew the job timeout in this step
      # alone (13m19s, against ~45-70s on a good day): the Chromium + headless shell + ffmpeg
      # downloads took **10 seconds** end to end. The rest was `--with-deps` running apt-get
      # against a stalled mirror, every gap of it fetching a FONT package. So the fix people
      # reach for first — caching ~/.cache/ms-playwright while keeping --with-deps — would
      # have saved ten seconds and left the failure exactly where it was.
      #
      # The runner image already ships Chromium's shared libraries (it carries Chrome and
      # Edge), so what --with-deps adds here is glyph coverage for scripts this suite never
      # renders: our specs assert DOM text and visibility, and the site serves its OWN
      # webfonts from public/fonts. A missing system font would change pixels, not
      # `getByText`.
      #
      # Deliberately NOT the official Playwright container, which would fix this too: it has
      # to be pinned to the Playwright version, and that is a second copy of a version the
      # lockfile already states — the exact drift the setup-bun comment above refuses. The
      # image the media job runs in is built on the same principle and carries no browser at
      # all; see .github/ci-image/Dockerfile.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the lockfile, so a Playwright bump gets fresh binaries. It also
          # invalidates on unrelated dependency changes; a miss costs the ten seconds
          # measured above, so correctness is worth more here than the hit rate.
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # A no-op when the cache restored the binaries, a re-download when it did not — so
      # this is the self-healing step and the cache is only ever an optimization.
      - name: Install Playwright Chromium
        run: bunx playwright install chromium

      - name: Apply database migrations
        run: bun run db:migrate

      - name: Run the hermetic specs
        working-directory: apps/web
        env:
          CI: "true"
        run: bunx playwright test $(bun run scripts/e2e-projects.ts hermetic)

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-browser
          path: apps/web/playwright-report/
          retention-days: 7

  browser-media:
    needs: precheck
    if: needs.precheck.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # GHCR publishes this package private by default, so the pull is authenticated below.
      packages: read

    # The image is ffmpeg + poppler + Chromium's shared libraries and nothing that states a
    # version this repo already states — no browser, no Bun. Built by `ci-image.yml`, which
    # is where every `apt-get` in this pipeline now lives. `:latest` is safe precisely
    # because the image declares no dependency versions of its own; see that file's header.
    container:
      image: ghcr.io/anthers-inc/anthers-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 🚨 A container job's default shell is `sh -e {0}`, NOT the runner's `bash -e {0}`.
    # Found the first time this job ran: `set -o pipefail` — which every other `run:` block
    # in this file may use freely — died with `Illegal option -o pipefail`. Everything else
    # about the container had worked. Setting the default once means a step written for this
    # file behaves the same wherever it is pasted, rather than depending on which job it
    # landed in; the alternative is discovering the difference one bashism at a time.
    defaults:
      run:
        shell: bash

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: anthers
          POSTGRES_PASSWORD: anthers
          POSTGRES_DB: anthers
        options: >-
          --health-cmd "pg_isready -U anthers -d anthers"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # 🚨 `postgres`, NOT `localhost` — the one thing that genuinely changes when a job
      # moves into a container. Service containers share a network with the job container
      # and are addressed by service name; `localhost` here is this container, where nothing
      # is listening on 5432. The API started by playwright's webServer runs INSIDE this
      # container, so it reads the same variable and reaches the same place.
      DATABASE_URL: postgres://anthers:anthers@postgres:5432/anthers

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        # Same reasoning as the browser job above: the version comes from package.json.

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # The image deliberately has no browser — this installs the one the lockfile states.
      - name: Install Playwright Chromium
        run: bunx playwright install chromium

      # What the image is FOR. If either of these is ever missing, the fixture no-ops and
      # the byte assertions skip **silently** — a quiet coverage loss rather than a red run,
      # which is exactly what the gauntlet exists to prevent. So assert them rather than
      # trusting the image to be what it was yesterday.
      - name: Media tools are present
        run: |
          set -euo pipefail
          ffmpeg -version | head -1
          pdftoppm -v 2>&1 | head -1

      - name: Apply database migrations
        run: bun run db:migrate

      - name: Run the media specs
        working-directory: apps/web
        env:
          CI: "true"
        run: bunx playwright test $(bun run scripts/e2e-projects.ts media)

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-browser-media
          path: apps/web/playwright-report/
          retention-days: 7

  # ─── The deploy gate ──────────────────────────────────────────────────────────
  #
  # This is what makes CI authoritative instead of advisory. `deploy_on_push` is now
  # false on every component, so App Platform builds nothing on its own and this job is
  # the only path to production.
  #
  # The `if` is the whole design, and it is not `needs: [test, images]` alone — that
  # would be wrong in the ORDINARY case. `precheck` skips the test jobs when this exact
  # SHA already passed on `main`, and a `needs` on a skipped job skips its dependents
  # too, so the common deploy would never fire. What this asserts instead is the honest
  # condition: nothing failed, and nothing was cancelled. A skipped suite reaches here
  # only via precheck, which skips only after confirming a green run on the same SHA.
  #
  # `!cancelled()` rather than `success()` for the same reason: `success()` requires
  # every dependency to have succeeded, which a deliberate skip is not.
  deploy:
    needs: [precheck, test, images, browser, browser-media]
    if: >-
      github.event_name == 'push' && github.ref_name == 'release' &&
      !cancelled() && !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Two deploys of the same app at once is a race App Platform resolves by superseding
    # one, which makes the losing run's green mark a lie. Serialize instead, and never
    # cancel one in flight — an interrupted deploy is the one state worse than a slow one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # The app ID comes from the DO_APP_ID repository variable and nothing else. It used
      # to carry a hardcoded literal as a fallback — harmless while the repo was private
      # (it is useless without the token) but it is infrastructure identity, and this repo
      # is world-readable. A missing variable now fails loudly on the line below, which is
      # a better failure than deploying to whatever the literal happened to still name.
      - name: Deploy ${{ github.sha }}
        env:
          APP_ID: ${{ vars.DO_APP_ID }}
        run: |
          set -o pipefail
          if [ -z "$APP_ID" ]; then
            echo "::error::DO_APP_ID is not set. Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          echo "::notice::Deploying ${{ github.sha }} to production"
          # --wait blocks until the deployment settles, so this job is red when the build
          # fails rather than green-on-submitted. App Platform keeps the previously-active
          # deployment serving throughout, so a failure here leaves prod on the last good
          # build rather than down.
          doctl apps create-deployment "$APP_ID" --wait --format ID,Phase

      # The `--wait` above blocks until the deployment settles, which means the new
      # deployment should be ACTIVE by the time this step runs. Asserting that here
      # catches the case `--wait` alone does not: a deploy that *superseded* an earlier
      # one and reported success while the earlier build kept serving, or a build that
      # settled into ERROR while the previously-active deployment stayed ACTIVE.
      #
      # This is the same check `deploy-watch.yml` runs hourly, against the same script,
      # so a deploy that passes here and then drifts later (a manual rollback, a second
      # deploy from somewhere) is still caught by the scheduled run. What this step
      # adds is immediate feedback: the deploy job itself goes red if prod isn't serving
      # what we just pushed, rather than waiting up to an hour for the watcher.
      - name: Verify production is serving ${{ github.sha }}
        env:
          APP_ID: ${{ vars.DO_APP_ID }}
          EXPECTED: ${{ github.sha }}
        run: |
          set -uo pipefail
          [ -n "$APP_ID" ] || { echo "::error::DO_APP_ID not set"; exit 1; }
          # Fetch the ACTIVE deployment's per-component commit hashes. The top-level
          # `source_commit_hash` on a deployment is misleading — it carries the repo
          # name, not the SHA; the real value is per-component (`services[0]`,
          # `static_sites[0]`, etc.). `scripts/deploy-status.ts` collects all of them
          # and would be the natural reuse, but it reads `release` from git and we want
          # to check against the exact SHA just deployed, so inline the check instead.
          LIVE=$(doctl apps list-deployments "$APP_ID" -o json \
            | jq -r '[.[] | select(.phase == "ACTIVE")
                      | (.services // []) + (.static_sites // []) + (.workers // []) + (.jobs // [])
                      | .[].source_commit_hash]
                    | unique | .[0] // empty')
          if [ -z "$LIVE" ]; then
            echo "::error::No ACTIVE deployment with a source_commit_hash found."
            echo "  The deploy may not have taken — check the App Platform console."
            exit 1
          fi
          # Compare short hashes — App Platform returns 40-char SHAs, `github.sha` is
          # 40 chars too, so a full-hash comparison is exact. Use short for the message.
          if [ "${LIVE:0:7}" != "${EXPECTED:0:7}" ]; then
            echo "::error::Production is serving ${LIVE:0:7}, not ${EXPECTED:0:7}."
            echo "  The deploy was created but did not become ACTIVE, or a different"
            echo "  deployment is ACTIVE. Check `doctl apps list-deployments $APP_ID`."
            exit 1
          fi
          echo "::notice::Production is serving ${LIVE:0:7} ✓"
