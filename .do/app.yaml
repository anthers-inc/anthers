# ──────────────────────────────────────────────────────────────────────────────
# DigitalOcean App Platform spec for the Anthers hub.
#
# Shape (decided 2026-07-01, hub on Managed Postgres):
#   - databases: a managed Postgres, bound to the app as ${anthers-db.DATABASE_URL}
#   - api        service   — Hono API (Dockerfile + FFmpeg), serves /api and /health
#   - worker     worker    — pg-boss job worker (transcode/audio/cross-publish + crons)
#   - migrate    PRE_DEPLOY job — runs Drizzle migrations before each release
#   - web        static site — the React SPA on the CDN
# The whole site sits behind SiteGate (SITE_PASSWORD) until public launch;
# SITE_ACCESS_KEYS holds the invite keys for ?invite= links that skip it.
#
# Deploys from the `release` branch on push. Apply with:
#   doctl apps create --spec .do/app.yaml         (first time)
#   doctl apps update <app-id> --spec .do/app.yaml (thereafter)
# Secrets (type: SECRET, no value here) are set in the DO dashboard or via
# `doctl apps update` — never commit their values.
#
# Interim postures for the gated skeleton, to tighten before public launch:
#   - databases: a dedicated Managed Postgres cluster (anthers-pg), bound as the
#     cluster admin (doadmin) so the migrate job can create schema/tables — a DO
#     *dev* database's user lacks CREATE and blocks migrations. Tighten to a
#     least-privilege app user before public launch.
#   - STORAGE_BACKEND=s3 → DO Spaces (bucket `anthers-media`, nyc3). SPACES_KEY /
#     SPACES_SECRET are dashboard-set secrets; bucket/region are non-secret here.
#     Objects use a creator-first key layout (creators/<creatorId>/…).
#   - ATProto envs are omitted (read lazily; that feature is still stubbed) — add
#     them when it comes online. STRIPE_* is NO LONGER omitted: prod runs Stripe
#     in test mode and the vars are declared below. (This line used to claim they
#     were absent, which stayed here for a while after they weren't.)
# ──────────────────────────────────────────────────────────────────────────────

name: anthers
region: nyc

databases:
  - name: anthers-db
    engine: PG
    version: "16"
    production: true
    cluster_name: anthers-pg
    # Bind as the cluster admin so migrations can CREATE schema/tables. A DO dev
    # database's user lacks CREATE, which blocks the migrate job; a managed
    # cluster's doadmin has full privileges. Tighten to a least-privilege app
    # user before public launch.
    db_name: defaultdb
    db_user: doadmin

# Shared across api, worker, and the migrate job (inherited by all components).
# Keep gate/email secrets at APP level, not on the api component: declaring them
# in both places lets the (empty) component-level copy shadow a dashboard-set
# app-level value. Set their VALUES once in the DO dashboard (encrypted).
envs:
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${anthers-db.DATABASE_URL}
  - key: STORAGE_BACKEND
    scope: RUN_TIME
    value: s3
  - key: SPACES_BUCKET
    scope: RUN_TIME
    value: anthers-media
  - key: SPACES_REGION
    scope: RUN_TIME
    value: nyc3
  - key: SPACES_KEY
    scope: RUN_TIME
    type: SECRET
  - key: SPACES_SECRET
    scope: RUN_TIME
    type: SECRET
  - key: SITE_PASSWORD
    scope: RUN_TIME
    type: SECRET
  - key: SITE_ACCESS_KEYS
    scope: RUN_TIME
    type: SECRET
  - key: RESEND_API_KEY
    scope: RUN_TIME
    type: SECRET
  # Session-cookie domain, read by routes/auth.ts on set AND on delete. Left unset
  # deliberately: unset means a host-only cookie, which is correct while the SPA and
  # the API share the apex origin (the Studio calls the apex API, so it's still
  # same-site). It becomes REQUIRED the moment the API moves to its own subdomain —
  # and note a cookie set with a domain can only be cleared with the same domain, so
  # changing this mid-flight strands existing sessions until they expire. Declared
  # here, valueless, so the knob is visible rather than lore.
  - key: COOKIE_DOMAIN
    scope: RUN_TIME
    value: ""
  # Stripe — TEST MODE in production, deliberately. Prod's STRIPE_PRICE_SEED is a
  # test-mode object ($3/mo recurring, livemode:false), so no real money can move;
  # the site is behind SiteGate besides. This block was missing from this file
  # entirely while prod carried the values, which is how the drift went unnoticed:
  # `lib/stripe.ts` builds its client from STRIPE_SECRET_KEY alone, so having that
  # set silently deactivated all seven `503 Payments are not configured` guards
  # while the client still had no publishable key to mount Elements with.
  # STRIPE_SUBSCRIPTION_WEBHOOK_SECRET is deliberately NOT here — PR #118 removed
  # its last consumer, though the live spec still carries it.
  - key: STRIPE_PRICE_SEED
    scope: RUN_TIME
    value: price_1TuuxeKtfvGGDfeNhvZrL2tm
  # Publishable, i.e. designed to be shipped to browsers — a value, not a SECRET.
  # Read at RUNTIME by `GET /api/payments/stripe/config`; it is not a build-time var.
  - key: STRIPE_PUBLISHABLE_KEY
    scope: RUN_TIME
    value: pk_test_51T9K9NKtfvGGDfeNjQyhpAn3hwewJpss3lkTUBmQd6d1oXjRGzomk1Rp1MPlTaJF6v9JXeU0RxQwQmeb9WT625xa00AIeV5S1A
  - key: STRIPE_SECRET_KEY
    scope: RUN_TIME
    type: SECRET
  - key: STRIPE_WEBHOOK_SECRET
    scope: RUN_TIME
    type: SECRET

ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /health
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /
      component:
        name: web

services:
  - name: api
    dockerfile_path: apps/api/Dockerfile
    source_dir: /
    github:
      repo: anthers-inc/Anthers
      branch: release
      deploy_on_push: true
    run_command: bun run apps/api/src/index.ts
    http_port: 8000
    instance_size_slug: basic-xxs
    instance_count: 1
    health_check:
      http_path: /health
    envs:
      - key: PORT
        scope: RUN_TIME
        value: "8000"
      - key: FRONTEND_URL
        scope: RUN_TIME
        value: ${APP_URL}
      # SITE_PASSWORD + RESEND_API_KEY live at app level (see the envs: block
      # above) to avoid component-level shadowing.

workers:
  - name: worker
    dockerfile_path: apps/api/Dockerfile
    source_dir: /
    github:
      repo: anthers-inc/Anthers
      branch: release
      deploy_on_push: true
    run_command: bun run apps/api/src/jobs/worker.ts
    instance_size_slug: basic-xxs
    instance_count: 1

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    dockerfile_path: apps/api/Dockerfile
    source_dir: /
    github:
      repo: anthers-inc/Anthers
      branch: release
      deploy_on_push: true
    run_command: bun run packages/db/src/migrate.ts
    instance_size_slug: basic-xxs
    instance_count: 1

static_sites:
  - name: web
    source_dir: /
    github:
      repo: anthers-inc/Anthers
      branch: release
      deploy_on_push: true
    # `bun run typecheck` (whole monorepo) gates the deploy: a type error in api
    # or web fails the build before anything ships. The static-site build checks
    # out the full repo, so it can typecheck both workspaces.
    build_command: bun install && bun run typecheck && bun run --cwd apps/web build
    output_dir: apps/web/dist
    catchall_document: index.html
