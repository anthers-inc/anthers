# ──────────────────────────────────────────────────────────────────────────────
# DigitalOcean App Platform spec for the Anthers hub.
#
# Shape (decided 2026-07-01, hub on Managed Postgres):
#   - databases: a managed Postgres, bound to the app as ${anthers-db.DATABASE_URL}
#   - api        service   — Hono API (Dockerfile + FFmpeg), serves /api and /health
#   - worker     worker    — pg-boss job worker (transcode/audio/cross-publish + crons)
#   - migrate    PRE_DEPLOY job — runs Drizzle migrations before each release
#   - web        static site — the React SPA on the CDN
# The whole site sits behind SiteGate (SITE_PASSWORD) until public launch.
#
# Deploys from the `release` branch on push. Apply with:
#   doctl apps create --spec .do/app.yaml         (first time)
#   doctl apps update <app-id> --spec .do/app.yaml (thereafter)
# Secrets (type: SECRET, no value here) are set in the DO dashboard or via
# `doctl apps update` — never commit their values.
#
# Interim postures for the gated skeleton, to tighten before public launch:
#   - databases: dev-tier Postgres (provisioned with the app). Upgrade to a
#     dedicated production cluster (production: true + cluster_name) before real
#     users — there is no real data yet, so it's just re-migrate + re-seed.
#   - STORAGE_BACKEND=local (ephemeral, unused while gated). Switch to s3 +
#     provision DO Spaces (bucket + CORS + scoped keys) when media features go live.
#   - Stripe / ATProto envs are omitted (read lazily; features stubbed/gated) —
#     add them when those features come online.
# ──────────────────────────────────────────────────────────────────────────────

name: anthers
region: nyc

databases:
  - name: anthers-db
    engine: PG
    version: "16"

# Shared across api, worker, and the migrate job (inherited by all components).
envs:
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${anthers-db.DATABASE_URL}
  - key: STORAGE_BACKEND
    scope: RUN_TIME
    value: local

ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /health
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /
      component:
        name: web

services:
  - name: api
    dockerfile_path: apps/api/Dockerfile
    source_dir: /
    github:
      repo: parkerhdavis/Anthers
      branch: release
      deploy_on_push: true
    run_command: bun run apps/api/src/index.ts
    http_port: 8000
    instance_size_slug: basic-xxs
    instance_count: 1
    health_check:
      http_path: /health
    envs:
      - key: PORT
        scope: RUN_TIME
        value: "8000"
      - key: FRONTEND_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: SITE_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET

workers:
  - name: worker
    dockerfile_path: apps/api/Dockerfile
    source_dir: /
    github:
      repo: parkerhdavis/Anthers
      branch: release
      deploy_on_push: true
    run_command: bun run apps/api/src/jobs/worker.ts
    instance_size_slug: basic-xxs
    instance_count: 1

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    dockerfile_path: apps/api/Dockerfile
    source_dir: /
    github:
      repo: parkerhdavis/Anthers
      branch: release
      deploy_on_push: true
    run_command: bun run packages/db/src/migrate.ts
    instance_size_slug: basic-xxs
    instance_count: 1

static_sites:
  - name: web
    source_dir: /
    github:
      repo: parkerhdavis/Anthers
      branch: release
      deploy_on_push: true
    build_command: bun install && bun run --cwd apps/web build
    output_dir: apps/web/dist
    catchall_document: index.html
