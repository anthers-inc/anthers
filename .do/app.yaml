# ──────────────────────────────────────────────────────────────────────────────
# DigitalOcean App Platform spec for the Anthers hub.
#
# Shape (decided 2026-07-01, hub on Managed Postgres):
#   - databases: a managed Postgres, bound to the app as ${anthersdb.DATABASE_URL}
#   - api        service   — Hono API (Dockerfile + FFmpeg), serves /api and /health
#   - worker     worker    — pg-boss job worker (transcode/audio/scans/records + crons)
#   - migrate    PRE_DEPLOY job — runs Drizzle migrations before each release
#   - web        static site — the React SPA on the CDN
#
# Deploys from the `release` branch on push. Apply with:
#   doctl apps create --spec .do/app.yaml         (first time only)
#   make spec-apply APPLY=1                        (thereafter)
#
# 🚨 NEVER `doctl apps update --spec .do/app.yaml`. That header said to for months and
# it is how production broke on 2026-08-15. Secrets below are declared `type: SECRET`
# with NO VALUE — they have to be, the values must not be in git — and App Platform
# reads a valueless secret as "set it to the empty string", not "leave it alone". One
# such command emptied all seven app-level secrets at once. The api crashed on the two
# that are validated at boot (STORAGE_KEY/STORAGE_SECRET) and the other five failed
# silently, while `doctl apps spec get` went on reporting well-formed EV[1:…] blobs for
# every one of them — so nothing looked wrong, and re-applying the live spec only
# re-applied the empties. Recovery was `doctl apps spec get <app> --deployment
# <last-good>`, which still carries the real encrypted values.
#
# The same command also silently dropped `features: [buildpack-stack=ubuntu-22]`, which
# this file has never declared. Applying a partial description of production deletes
# whatever it omits; secrets are only the most expensive case.
#
# `make spec-apply` merges the live secret values and any live-only fields into this
# file before sending it, and refuses rather than sending a valueless secret. It is a
# dry run without APPLY=1. `make spec-diff` reports the drift and now fails when a live
# secret is empty. Secret VALUES are set in the DO dashboard, or introduced with
# `bun run scripts/spec-apply.ts --set KEY=value` — never committed here.
#
# Interim postures for the gated skeleton, to tighten before public launch:
#   - databases: a dedicated Managed Postgres cluster (anthers-pg), bound as the
#     cluster admin (doadmin) so the migrate job can create schema/tables — a DO
#     *dev* database's user lacks CREATE and blocks migrations. Tighten to a
#     least-privilege app user before public launch.
#   - STORAGE_BACKEND=s3 → Cloudflare R2, TWO buckets (private/public — R2 has no
#     per-object ACLs, so the bucket is the access boundary). STORAGE_KEY /
#     STORAGE_SECRET are dashboard-set secrets; everything else is non-secret here.
#     Objects use a creator-first key layout (creators/<creatorId>/…).
#   - STRIPE_* is declared below: prod runs Stripe in LIVE mode, on the corporation's
#     own account, since the 2026-10-03 cutover.
# ──────────────────────────────────────────────────────────────────────────────

name: anthers
region: nyc

# The buildpack stack the static site builds on. Declared here since 2026-08-15 because it
# was NOT: it existed only on the live app, so `doctl apps update --spec .do/app.yaml`
# deleted it in the same command that emptied the secrets, and nothing reported either.
# `make spec-apply` would now carry an undeclared field over rather than dropping it, but a
# field this file states is one that cannot be lost by a tool nobody used.
features:
  - buildpack-stack=ubuntu-22

# 🚨 DECLARED HERE, and it is not decoration. A custom domain has to be attached to the
# APP as well as pointed at in DNS: App Platform routes on the Host header, so a correct
# CNAME to an app that does not claim the name returns 404 for everything. That is exactly
# what happened on 2026-08-11 — DNS was right, the app was healthy on its own ingress, and
# the apex 404'd until these four lines existed. Recreating this app from the spec without
# them would reproduce the outage.
#
# Note App Platform enforces domain uniqueness ACROSS accounts: attaching a name another
# app still holds returns `409 App domain already exists`, so a migration has to release it
# from the old app first.
domains:
  - domain: anthers.org
    type: PRIMARY
  - domain: www.anthers.org
    type: ALIAS
  # The admin app. On this app rather than its own, because it is a second static site over the
  # same API and database; the ingress rule below is what sends its host to the admin site.
  - domain: admin.anthers.org
    type: ALIAS

databases:
  # `anthersdb`, not `anthers-db` — this is the component name the LIVE app uses, and
  # `make spec-diff` caught it disagreeing. The name is not cosmetic: it is the
  # interpolation key in `${anthersdb.DATABASE_URL}` below, so a spec carrying the
  # other one describes a database binding that does not exist. Applying it would have
  # been a genuinely bad day, which is a fair illustration of why the committed spec is
  # not authoritative here.
  - name: anthersdb
    engine: PG
    version: "16"
    production: true
    cluster_name: anthers-pg
    # Bind as the cluster admin so migrations can CREATE schema/tables. A DO dev
    # database's user lacks CREATE, which blocks the migrate job; a managed
    # cluster's doadmin has full privileges. Tighten to a least-privilege app
    # user before public launch.
    db_name: defaultdb
    db_user: doadmin

# Shared across api, worker, and the migrate job (inherited by all components).
# Keep gate/email secrets at APP level, not on the api component: declaring them
# in both places lets the (empty) component-level copy shadow a dashboard-set
# app-level value. Set their VALUES once in the DO dashboard (encrypted).
envs:
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${anthersdb.DATABASE_URL}
  - key: STORAGE_BACKEND
    scope: RUN_TIME
    value: s3
  # Cloudflare R2, two buckets. The SPACES_* names are gone rather than kept as a
  # fallback: this app was created fresh on the Anthers-owned account and has never
  # run against DigitalOcean Spaces, so there is no live value for them to shadow and
  # nothing to roll back to. (`config.ts` still honours them — that fallback exists for
  # the app being decommissioned, not for this one.)
  - key: STORAGE_ENDPOINT
    scope: RUN_TIME
    value: https://42e9a13ee9f7af4092581dc675c9f4da.r2.cloudflarestorage.com
  # 🚨 `auto`, not a region. R2 ignores region for placement but VALIDATES the name, and
  # the code's default is `nyc3` (Spaces). Get this wrong and every call fails — direct
  # ones with InvalidRegionName, presigned ones as SignatureDoesNotMatch, because SigV4
  # folds region into the credential scope. The second symptom points nowhere near the
  # cause, which is what makes it expensive.
  - key: STORAGE_REGION
    scope: RUN_TIME
    value: auto
  # Everything gated. NO custom domain, no r2.dev, ever — on R2 a public door is granted
  # to the whole BUCKET, so one would publish every game asset, HLS segment and audio file.
  - key: STORAGE_BUCKET
    scope: RUN_TIME
    value: anthers-media-private
  # Display chrome only. This is the bucket cdn.anthers.org points at.
  - key: STORAGE_PUBLIC_BUCKET
    scope: RUN_TIME
    value: anthers-media-public
  # 🚨 The CUSTOM DOMAIN, never the S3 endpoint. Absolute URLs are persisted in the
  # database and decoded back to keys by PATHNAME; the S3 endpoint is path-style, so it
  # would glue the bucket name onto every key written afterwards — new uploads 404 while
  # older rows keep resolving, which is the hardest shape of bug to spot.
  - key: STORAGE_PUBLIC_BASE_URL
    scope: RUN_TIME
    value: https://cdn.anthers.org
  - key: STORAGE_FORCE_PATH_STYLE
    scope: RUN_TIME
    value: "true"
  - key: STORAGE_KEY
    scope: RUN_TIME
    type: SECRET
  - key: STORAGE_SECRET
    scope: RUN_TIME
    type: SECRET
  - key: RESEND_API_KEY
    scope: RUN_TIME
    type: SECRET
  # The key that seals the password of every identity Anthers hosts, so that a copy of the
  # database is not a copy of the credentials. 32 bytes, hex or base64.
  #
  # 🚨 **Losing this loses every hosted account.** The node has no mail configured, so its
  # own password reset cannot run, and the passwords were generated rather than chosen — a
  # sealed value nobody can open leaves an identity only the node's admin password could
  # ever get back into. It belongs in the vault before it belongs here.
  #
  # ⚠️ **Unset closes the handle door rather than breaking anything.** `hostedIdentityOffered`
  # checks for it, so an API that boots without it simply does not offer to issue handles.
  #
  # At APP level because the api issues identities today and the worker will write records
  # into them, and a component-level copy would shadow the app-level value for the other.
  - key: HOSTED_ACCOUNT_KEY
    scope: RUN_TIME
    type: SECRET
  # Signs Resend's delivery webhook (POST /api/webhooks/resend). Distinct from the
  # API key on purpose: the key SENDS and this only VERIFIES what Resend pushes back,
  # so nothing here ever needs a credential that can read mail. Unset means the
  # endpoint refuses every request — it fails closed, never open.
  - key: RESEND_WEBHOOK_SECRET
    scope: RUN_TIME
    type: SECRET
  # Printful — the merch fulfiller (Sell Anthers apparel through the Printful API).
  # A store-scoped private token against the Anthers store; every Printful operation
  # goes through `services/printful.ts`, and the client is built from this once.
  # Unset means merch routes answer 503 and the physical refusals stand — unset fails
  # closed toward "not for sale", which is the honest posture while the store is empty.
  # At APP level beside the other merchant-of-record secrets; the webhook receiver in
  # the api and the (future) placement sweep in the worker both want it.
  #
  # The name matches the Bitwarden entry exactly (`Anthers Prod` / `Anthers Dev` both
  # carry it), so `make spec-apply FROM_BWS=1` resolves it with no third spelling.
  - key: PRINTFUL_TOKEN
    scope: RUN_TIME
    type: SECRET
  # Shield by Project Arachnid — the child-safety detection vendor. Basic auth, so a
  # username and a password rather than a key. At APP level because the scan runs in the
  # worker, which inherits app-level values alongside the few it declares itself.
  #
  # Unset means no detection vendor is configured, and the scan records `unscannable`
  # rather than `clean` — a deployment state, not a failure, and deliberately not
  # something that reads as "we looked and found nothing".
  #
  # 🚨 The key NAMES must match the Bitwarden entries exactly: `scripts/spec-apply.ts`
  # resolves secret values from the vault BY NAME, so that there is no third list to
  # drift. Introduce them with `make spec-apply FROM_BWS=1` after they exist in the
  # `Anthers` project.
  - key: ARACHNID_SHIELD_USERNAME
    scope: RUN_TIME
    type: SECRET
  - key: ARACHNID_SHIELD_PASSWORD
    scope: RUN_TIME
    type: SECRET
  # Noun Project Icon API — the Badge Maker's vendor leg (creator-facing catalog search
  # and emblem composition), runtime. At APP level because the compose runs in the API
  # and the budget/breaker service may be read by the worker.
  #
  # The vault (Anthers Prod) carries the same names, so `make spec-apply FROM_BWS=1`
  # resolves them with no third spelling anywhere. Unset means the search routes answer
  # an error the picker states — the picker degrades, the rest of the platform is
  # unaffected. The monthly spend cap is set on the vendor's dashboard against this key;
  # `NOUN_PROJECT_MONTHLY_CAP_USD` (below, non-secret) is the breaker's local figure.
  - key: NOUN_PROJECT_KEY
    scope: RUN_TIME
    type: SECRET
  - key: NOUN_PROJECT_SECRET
    scope: RUN_TIME
    type: SECRET
  # The Badge Maker's circuit breaker: the key's monthly spend cap in dollars, as a
  # LOCAL estimate bound (the routes degrade at 90% of it rather than letting the
  # vendor's own cap hard-fail a save mid-launch). Sits at the dashboard cap ($25,
  # Parker 2026-10-07); the 90% degradation is the buffer beneath it. Keep at or below
  # the cap configured on the vendor's dashboard, which is the authority.
  - key: NOUN_PROJECT_MONTHLY_CAP_USD
    scope: RUN_TIME
    value: "25"
  # COOKIE_DOMAIN lives on the api component below, NOT here — see the note there.
  # It was declared at app level and valueless in this file for weeks while production
  # ran `.anthers.org` on the component, which is the drift `make spec-diff` exists to
  # catch and very nearly didn't: the two entries sat at different paths, so a key-set
  # comparison reported "one here, one there" without ever comparing the values.
  # Stripe — LIVE mode in production since the 2026-10-03 cutover, on the Anthers, Inc.
  # account. Every Stripe object in the live app is `livemode: true` and real money moves:
  # the publishable key below is a `pk_live_…`, and the two signing secrets the platform
  # holds are the *live* event destinations' — so a test-mode key set here would not be a
  # harmless posture but a silent switch of which account the site bills.
  # 🚨 The separate `Anthers, Inc. - Sandbox` account is for dev and test, and its webhook
  # endpoints must never point at the production URL: the app verifies signatures against
  # the live secrets, so a test-mode destination here answers 400 until Stripe disables it
  # (two such endpoints, created 2026-08-15, were disabled 2026-10-19 after one tripped
  # Stripe's nine-day failure rule and emailed a warning).
  # This block was missing from this file
  # entirely while prod carried the values, which is how the drift went unnoticed:
  # `lib/stripe.ts` builds its client from STRIPE_SECRET_KEY alone, so having that
  # set silently deactivated all seven `503 Payments are not configured` guards
  # while the client still had no publishable key to mount Elements with.
  # STRIPE_SUBSCRIPTION_WEBHOOK_SECRET is deliberately NOT here — PR #118 removed
  # its last consumer, though the live spec still carries it.
  # ⚠️ STRIPE_PRICE_SEED was here until 2026-08-17 and had been read by nothing since
  # PR #24: the Seed retirement replaced one Price billed by quantity with a Product per
  # destination priced inline, because a quantity can only express whole multiples of one
  # unit. Its replacement is provisioned on demand (`ensureAnthersProduct`) rather than
  # declared, since an id an operator must remember to set in every environment is the
  # failure mode that took subscribing down in production the day the retirement shipped.
  # Publishable, i.e. designed to be shipped to browsers — a value, not a SECRET.
  # Read at RUNTIME by `GET /api/payments/stripe/config`; it is not a build-time var.
  - key: STRIPE_PUBLISHABLE_KEY
    scope: RUN_TIME
    value: pk_live_51T9K9C3WJAPZ8pU6Ork5QyDxB39FXOuQig2866QiqjFjzC3fC4Qrszw1Sm2gr7Szrz9DopUgmj42bVQmUWcvVGqp002jowXSre
  # Card-only checkout: the account's Default payment-method configuration is
  # card-only in the Dashboard (narrowed 2026-10-06 — card on, every other method
  # off; completed 2026-10-07 when the separate "Card only" configuration was
  # deleted and Default carried the narrowing alone), so a checkout session needs
  # no `payment_method_configuration` parameter: the Dashboard's account-wide
  # Default governs the embedded Payment Element on this API version. No env var
  # is declared on purpose. The code lever (`payments.ts` reads
  # `STRIPE_PAYMENT_METHOD_CONFIGURATION` when set) is kept for a genuinely
  # per-deployment override — a config named for where it is used — but no
  # deployment names one today. The live variable naming the deleted
  # "Card only" configuration was removed on 2026-10-07 (its inactivation was
  # breaking every checkout session creation); the code lever stayed.
  - key: STRIPE_SECRET_KEY
    scope: RUN_TIME
    type: SECRET
  - key: STRIPE_WEBHOOK_SECRET
    scope: RUN_TIME
    type: SECRET
  # The SECOND signing secret, for the *connected accounts* event destination.
  #
  # Stripe issues one secret per destination and scopes them separately, so the single URL
  # above serves two: `your account` (purchases, subscriptions, refunds) and `connected
  # accounts`, which is the only scope that ever delivers `account.updated` — creator payout
  # enablement after Connect onboarding. `payments.ts` tries both secrets and 400s only when
  # neither verifies; with just the primary set it behaves as it always did.
  #
  # 🚨 Not the same value as the one above. They are both 38-byte `whsec_` strings, so a
  # copy-paste of the wrong one is invisible by inspection — the tell is that `account.updated`
  # silently stops arriving while everything else keeps working.
  - key: STRIPE_CONNECT_WEBHOOK_SECRET
    scope: RUN_TIME
    type: SECRET
  # DMCA designated agent — public statutory information (NOT secret). § 512(c)(2)
  # requires the agent's details to be published on the site; the Copyright Office's
  # own DMCA directory publishes them for every registered agent. Registered
  # 2026-08-15. The three-year expiry clock belongs in the vault's Colorado Nonprofit
  # Compliance Reference and in its Compliance Calendar.
  - key: DMCA_AGENT_REGISTERED
    scope: RUN_TIME
    value: "true"
  - key: DMCA_AGENT_NAME
    scope: RUN_TIME
    value: "Parker Davis"
  - key: DMCA_AGENT_ADDRESS
    scope: RUN_TIME
    value: "1500 N Grant St, Ste R, Denver, CO, 80203 US"
  - key: DMCA_AGENT_EMAIL
    scope: RUN_TIME
    value: copyright@anthers.org
  - key: DMCA_AGENT_PHONE
    scope: RUN_TIME
    value: "(720) 404-2603"

  # Whether the Studio ASKS a creator for permission to publish their Work listings into a
  # repository Anthers does not host. Read as the literal string "true" and nothing else, so an
  # unset or misspelled value means closed.
  #
  # 🚨 **It gates asking, never using.** A permission already granted goes on working with
  # this off, because a switch that stopped Anthers using one would strand every listing
  # already on the network — held under a permission Anthers declined to use, on records it
  # could no longer withdraw. Closing the door decides who walks through it next.
  #
  # ⭐ Open because the permissions are asked for as published permission sets —
  # `org.anthers.userPermissions` and `org.anthers.creatorPermissions` — which bsky.social
  # resolves and expands, so the consent screen shows a sentence rather than a raw scope string.
  - key: ATPROTO_PUBLISH_ENABLED
    scope: RUN_TIME
    value: "true"

ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /health
      component:
        name: api
        preserve_path_prefix: true
    # 🚨 The managing app is an atproto service, and both of its public paths sit at the host
    # root rather than under `/api`. `did:web` looks for its document at `/.well-known/did.json`,
    # and every XRPC service answers at `/xrpc/<nsid>` — the protocol's client builds that URL by
    # replacing the base path, so it cannot live under `/api`. Without these rules the site's
    # catch-all answers both with `index.html`, the managing app looks unreachable, and every
    # gated space refuses the reader it should have admitted.
    - match:
        path:
          prefix: /.well-known/did.json
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /xrpc/
      component:
        name: api
        preserve_path_prefix: true
    # 🚨 The admin host's API rules have to name the host themselves. A rule that matches on
    # authority outranks one that matches on path alone, so without these the admin site's
    # catch-all below took `/api` on admin.anthers.org as well: a GET came back as the app's own
    # index.html with a 200 and a POST as a storage error, and the app could not sign anybody in.
    # The admin app's pages call `/api` on their own origin, which is what these route.
    - match:
        authority:
          exact: admin.anthers.org
        path:
          prefix: /api
      component:
        name: api
        preserve_path_prefix: true
    - match:
        authority:
          exact: admin.anthers.org
        path:
          prefix: /health
      component:
        name: api
        preserve_path_prefix: true
    # Everything else on the admin host is the admin site. Listed before the site's catch-all so
    # the host match is not shadowed by it. The API itself refuses operator routes on any other
    # host, so a routing mistake between the two sites fails closed.
    - match:
        authority:
          exact: admin.anthers.org
        path:
          prefix: /
      component:
        name: admin
    - match:
        path:
          prefix: /
      component:
        name: web

# `deploy_on_push` is FALSE on every component below, and that is load-bearing rather
# than a leftover: since 2026-08-09 the `deploy` job in .github/workflows/ci.yml is the
# only path to production, so a push to `release` builds nothing until CI is green.
# Flipping any of these back to `true` silently removes the gate — App Platform would
# start building on push again and the CI verdict would stop mattering.
#
# To deploy without CI (a hotfix while the suite is red): `doctl apps create-deployment
# <app-id>`. Deliberately not a make target; bypassing the gate should take a moment's
# thought.
services:
  - name: api
    # App Platform metric alerts, rendered by scripts/resource-alerts.ts (2026-10-07):
    # each emails OPS_ALERT_EMAIL, and each value is the shared threshold table's "now"
    # band — the alert and the console must never disagree about the number that trips.
    alerts:
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 90
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 90
        window: FIVE_MINUTES
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 3
        window: ONE_HOUR
    dockerfile_path: apps/api/Dockerfile
    source_dir: /
    github:
      repo: anthers-inc/anthers
      branch: release
      deploy_on_push: false
    run_command: bun run apps/api/src/server.ts
    http_port: 8000
    # 1 dedicated vCPU / 1GB — the $34 tier. The frame-thumbnail extraction decodes on
    # this component, and a shared instance throttles it (16s measured on a heavy source,
    # 2026-10-16); a dedicated core is the steady, 2-4x step. The migrate PRE_DEPLOY job
    # stays on basic-xxs — it runs a migration and exits.
    instance_size_slug: apps-d-1vcpu-1gb
    instance_count: 1
    health_check:
      http_path: /health
    envs:
      - key: PORT
        scope: RUN_TIME
        value: "8000"
      - key: FRONTEND_URL
        scope: RUN_TIME
        value: ${APP_URL}
      # The admin app's origin. The operator routes answer only on this host and accept changes only
      # from this origin (`lib/admin-host.ts`), and with it unset on a public deployment they answer
      # nowhere — so this is what turns the admin app on, not a hint.
      - key: ADMIN_URL
        scope: RUN_TIME
        value: https://admin.anthers.org
      # Session-cookie domain, read by routes/auth.ts on set AND on delete.
      #
      # `.anthers.org` — DOT-PREFIXED, so the cookie is sent to the apex and to every
      # subdomain. ⚠️ The reason changed on 2026-08-11 and the value did not. It was here
      # for `studio.anthers.org`, which no longer exists — the Studio is `/studio` on this
      # origin now. What still requires it is **`www.anthers.org`**, an ALIAS domain on
      # this same app: a host-only cookie set at the apex is not sent to `www`, so signing
      # in on one and browsing the other would silently sign you out.
      #
      # Do NOT "tidy" this to empty on the strength of the Studio being gone — that is the
      # exact reasoning that would break it. A cookie set with a domain can only be cleared
      # with the same domain, so changing it strands every live session until it expires.
      - key: COOKIE_DOMAIN
        scope: RUN_TIME
        value: .anthers.org
      # The Personal Data Server that issues Anthers handles. Declared here as well as on the
      # worker rather than app-level, for the reason `FRONTEND_URL` gives over there: the two
      # components each name it explicitly, so there is no precedence question and no empty
      # component copy able to shadow an app-level value.
      - key: HOSTED_PDS_URL
        scope: RUN_TIME
        value: https://anthers.social
      # The credential the node requires of anybody creating an account on it.
      #
      # 🚨 **An invite code and deliberately NOT the node's admin password.** Both would work.
      # An invite code can create accounts and nothing else; the admin password can reset any
      # account's password, rename any handle and delete any account — so holding that here
      # would make a compromise of this app a compromise of every identity Anthers hosts.
      # Minted by hand on the node with a `useCount`, and replacing it is one command.
      #
      # ⚠️ It runs out silently. The node answers `InvalidInviteCode` when the count is spent,
      # which is reported as an operational failure and alerted rather than shown to whoever
      # was signing up, because it is not their fault and they cannot fix it.
      - key: HOSTED_PDS_INVITE_CODE
        scope: RUN_TIME
        type: SECRET
      # RESEND_API_KEY and HOSTED_ACCOUNT_KEY live at app level (see the envs: block
      # above) to avoid component-level shadowing.
      # 🚨 HEARTBEAT_TOKEN was declared on the worker component once — the wrong one. The
      # ingest route (`POST /api/status/heartbeat`) answers on the api component, so the
      # secret must be declared HERE: a secret on a component that does not run the route
      # is an unset variable to the process that reads it, which 404'd every droplet
      # report for six days, and the status page's outside view stayed unknown the whole
      # time. The rule: check which component carries a variable before building on it.
      - key: HEARTBEAT_TOKEN
        scope: RUN_TIME
        type: SECRET

  # The web origin, which replaced the static site named `web` on 2026-10-19 so a Work's
  # link preview can name the Work. The app is still a folder of built files; this process
  # serves them exactly as the static site did and swaps the shell's neutral share block
  # for a Work's own on `/works/*` (`apps/web/serve.ts`). Everything else, every asset
  # included, is byte-for-byte what the build emitted.
  #
  # 🚨 The shell and the assets ship from THIS component together, on purpose. Splitting
  # them (a service for documents, the static site for chunk files) makes every deploy a
  # window in which the new shell names chunks the old static origin does not have yet.
  #
  # `API_ORIGIN` is the app's private network, not the public host: the card read must not
  # leave the app or queue behind Cloudflare. `SITE_ORIGIN` is the canonical the previews
  # and `<link rel=canonical>` name, so it is the apex rather than the app's default
  # ondigitalocean.app address.
  - name: web
    # The same rendered alert set as the api — the values are this component's "now" bands
    # from packages/shared/src/resource-thresholds.ts, per scripts/resource-alerts-lib.ts, so
    # the alert can never fire at a number the console does not render.
    alerts:
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 90
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 90
        window: FIVE_MINUTES
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 3
        window: ONE_HOUR
    source_dir: /
    github:
      repo: anthers-inc/anthers
      branch: release
      deploy_on_push: false
    # `bun run typecheck` (whole monorepo) gates the deploy, exactly as it did on the
    # static site: a type error in api or web fails the build before anything ships.
    build_command: bun install && bun run typecheck && bun run --cwd apps/web build
    run_command: bun run apps/web/serve.ts
    http_port: 3000
    instance_size_slug: basic-xxs
    instance_count: 1
    health_check:
      http_path: /_health
    envs:
      - key: PORT
        scope: RUN_TIME
        value: "3000"
      - key: API_ORIGIN
        scope: RUN_TIME
        value: http://api
      - key: SITE_ORIGIN
        scope: RUN_TIME
        value: https://anthers.org

workers:
  - name: worker
    # The same rendered alert set on the worker — rendered and explained at services:
    # scripts/resource-alerts-lib.ts (2026-10-07).
    #
    # 🚨 The CPU rule here is a SATURATION NOTICE, not an error signal (Parker, 2026-10-11).
    # The worker's healthy shape while draining media is a pegged graph — one encode at a
    # time on one core — so 90/5m fires on every video burst by design, including healthy
    # ones. Read it as "media is queued"; what means failure is RESTART_COUNT, MEM
    # outside a transcode's known peaks, and the queue's failed jobs driving /status. The
    # reasoning and the general rule behind reading a threshold this way is the wiki's
    # 83.02, section "The Worker's CPU Alert Trips on Healthy Work".
    alerts:
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 90
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 90
        window: FIVE_MINUTES
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 3
        window: ONE_HOUR
    dockerfile_path: apps/api/Dockerfile
    source_dir: /
    github:
      repo: anthers-inc/anthers
      branch: release
      deploy_on_push: false
    run_command: bun run apps/api/src/jobs/worker.ts
    # 4 GB and two DEDICATED vCPUs, because the transcode is the one wall-clock experience a
    # creator stares at and a shared vCPU delivered roughly a quarter of a modern core under the
    # sustained burn an encode is: a real 4:55 1080p upload took 55 minutes there (2026-10-11,
    # job 15) while the same full encode measures 13 minutes on one thread of a modern desktop
    # core. Idle is about 140 MB; a 1080p encode pinned to two threads peaks near 440 MB
    # (`lib/ffmpeg.ts`), its scan's frame decode near 165 MB, and scans, audio and ebooks each
    # run two at a time beside the one transcode. The thread pin (`FFMPEG_THREADS = 2`) and the
    # transcode's concurrency of one are sized to this plan — **raise both together if this
    # gains cores: never more ffmpeg threads than vCPUs, and never a second concurrent
    # transcode the cores cannot feed.** The transcode's concurrency stays one for now; raising
    # it is the queue-throughput lever, a deliberate later step.
    instance_size_slug: apps-d-2vcpu-4gb
    instance_count: 1
    envs:
      # 🚨 **Without this the worker sends NO ALERTS, and does it silently.**
      # `abuseAlertsEnabled()` is `isPublicDeployment()`, which is true only when an https
      # `BASE_URL` or `FRONTEND_URL` is present — and `FRONTEND_URL` was declared on the api
      # component ONLY. So on this component the check was false in production, and both
      # escalation sweeps take their `if (!abuseAlertsEnabled()) return 0` branch before
      # reaching a sender. `escalate-reports` has therefore run every five minutes and
      # returned 0 without ever sending: the retry for a floor report whose inline send
      # failed. The inline send itself is fine — it happens in the api process, which has
      # the variable.
      #
      # ⚠️ Declared HERE rather than app-level on purpose. The app-level block above warns
      # that declaring a key in both places lets an empty component copy shadow the
      # app-level value, and `FRONTEND_URL` is already on the api component — so mirroring
      # it here keeps both components explicit and introduces no precedence question.
      - key: FRONTEND_URL
        scope: RUN_TIME
        value: ${APP_URL}
      # The Personal Data Server whose hosted identities `watch-identities` watches. Unset,
      # the job still watches every identity it already knows about, and discovers none.
      - key: HOSTED_PDS_URL
        scope: RUN_TIME
        value: https://anthers.social
      # Where operational alerts go. 🛑 Deliberately NOT `abuse@`, which summons a person to
      # look at reported content and must not be diluted. There is no default in code,
      # because a default is a guess at a mailbox that may not exist and an alert to a
      # bouncing address is indistinguishable from no alert.
      - key: OPS_ALERT_EMAIL
        scope: RUN_TIME
        value: admin@anthers.org
      # Where deadline reminders go — the operator's own mailbox, per the 2026-09-14 decision
      # that anything with a deadline reaches the operator by email. Unset, the daily
      # deadline-reminders sweep logs one warning and sends nothing rather than guessing at an
      # address, which is the same refusal discipline the operational alerts above carry.
      - key: OPERATOR_EMAIL
        scope: RUN_TIME
        value: parker@anthers.org

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    dockerfile_path: apps/api/Dockerfile
    source_dir: /
    github:
      repo: anthers-inc/anthers
      branch: release
      deploy_on_push: false
    run_command: bun run packages/db/src/migrate.ts
    instance_size_slug: basic-xxs
    instance_count: 1

static_sites:
  # The admin app, served at admin.anthers.org by the ingress rule above. Not typechecked here:
  # the site's build above typechecks the whole monorepo at the same commit, and doing it twice
  # would only double the deploy.
  - name: admin
    source_dir: /
    github:
      repo: anthers-inc/anthers
      branch: release
      deploy_on_push: false
    build_command: bun install && bun run --cwd apps/admin build
    output_dir: apps/admin/dist
    catchall_document: index.html
