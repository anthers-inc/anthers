<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Anthers Admin</title>
    <!-- The saved light/dark choice, before first paint. Key and default mirror
         packages/web-shared/src/lib/theme.ts, which the site uses too. -->
    <script>
      try {
        if (localStorage.getItem("anthers_theme") === "dark")
          document.documentElement.setAttribute("data-theme", "dark");
      } catch {}
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="../../packages/brand/logo/web/icon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="../../packages/brand/logo/web/icon-64.png" />
    <link rel="stylesheet" href="./src/styles/globals.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
