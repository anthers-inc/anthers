<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Anthers Admin</title>
    <!-- The saved theme, before first paint. Key and default mirror
         packages/web-shared/src/lib/theme.ts, and the list mirrors THEME_VALUES in
         packages/shared/src/theme.ts — keep all three in sync. -->
    <script>
      try {
        const themes = [
          "light",
          "dark",
          "reef-light",
          "reef-dark",
          "ember-light",
          "ember-dark",
          "heather-light",
          "heather-dark",
        ];
        const saved = localStorage.getItem("anthers_theme");
        if (saved && themes.indexOf(saved) !== -1)
          document.documentElement.setAttribute("data-theme", saved);
      } catch {}
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="../../packages/brand/logo/web/icon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="../../packages/brand/logo/web/icon-64.png" />
    <link rel="stylesheet" href="./src/styles/globals.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
