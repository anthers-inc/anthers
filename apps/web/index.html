<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Link-preview metadata: the site-level card, and the region the web server replaces
         for a route that knows what it serves (a Work, today). The SPA's document is one
         shell for every path, so this block has to be true of the whole site on its own;
         `serve.ts` swaps everything between the markers for a Work's own tags and leaves it
         alone for every other route, including any Work rated above General. Absolute URLs
         only: crawlers do not resolve relative og values. og:image is the stable-address
         card in public/brand/ — its address is written down here and in `share-head.ts`, so
         read apps/web/public/brand/README.md before moving it. -->
    <!-- share:begin -->
    <title>Anthers</title>
    <meta name="description" content="Anthers is a nonprofit creative garden for everyone: a place for videos, games, music, writing, crafts, services, and more, all on an open-source, ad-free platform." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Anthers" />
    <meta property="og:title" content="Anthers" />
    <meta property="og:description" content="Anthers is a nonprofit creative garden for everyone: a place for videos, games, music, writing, crafts, services, and more, all on an open-source, ad-free platform. A harmonious ecosystem where we can all nurture a creative internet worth loving again." />
    <meta property="og:url" content="https://anthers.org/" />
    <meta property="og:image" content="https://anthers.org/brand/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Anthers wordmark, an orchid spray, and a bee above pale meadow grass." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Anthers" />
    <meta name="twitter:description" content="Anthers is a nonprofit creative garden for everyone: a place for videos, games, music, writing, crafts, services, and more, all on an open-source, ad-free platform." />
    <meta name="twitter:image" content="https://anthers.org/brand/og-card.png" />
    <!-- share:end -->
    <!-- Home-screen icons for surfaces that read a manifest (Android, install prompts).
         The bundle-imported icon links above are right where a page loads them, and this is
         the other shape: a manifest whose own internal src strings carry root-absolute
         addresses, so they run on both the dev server and production without rewriting.
         The bundler resolves this href like the icons and emits it content-hashed at the
         dist root — nothing outside the app references the manifest's own address by name. -->
    <link rel="manifest" href="./site.webmanifest" />
    <!-- Apply the saved light/dark choice before first paint. Default light (set on <html>);
         override to dark if stored. Key + default mirror packages/web-shared/src/lib/theme.ts. -->
    <script>
      try {
        if (localStorage.getItem("anthers_theme") === "dark")
          document.documentElement.setAttribute("data-theme", "dark");
      } catch {}
    </script>
    <!-- Self-hosted, deliberately: loading these from fonts.googleapis.com sent every
         visitor's IP, user-agent and referer to Google on first paint, before any
         consent could exist. See public/fonts/THIRD-PARTY.md.

         Why an inline @import and not a <link>: the bundler resolves every <link
         rel="stylesheet"> href and every url() in the CSS it reaches, and it inlines
         webfonts as base64 — which collapses all 83 subset cuts into one
         render-blocking 4.5 MB chunk and throws away the unicode-range split that
         keeps a latin-only visitor from downloading the cyrillic and vietnamese
         ones. An inline @import passes through untouched, so public/fonts/ stays
         plain static files in both dev and prod. `external` fixes only the
         production build; the dev server reads no such config and still fails to
         resolve. -->
    <style>
      @import "/fonts/fonts.css";
    </style>
    <!-- The tab icon. Referenced straight out of @anthers/brand rather than copied into
         public/: Bun's HTML bundler resolves a rel="icon" href the same way it resolves a
         stylesheet, emitting a content-hashed file and rewriting this to a root-absolute
         URL — so packages/brand stays the single home for the logo. A second copy under
         public/ would be a copy nothing checks against its source.

         All three are cut from the logo's 1:1 thumb by `bun run brand:logo`. There is no
         vector cut of the official logo, so the tab icon is a PNG at two densities and the
         browser picks by `sizes` rather than fetching both. -->
    <link rel="icon" type="image/png" sizes="32x32" href="../../packages/brand/logo/web/icon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="../../packages/brand/logo/web/icon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../../packages/brand/logo/web/icon-180.png" />
    <link rel="stylesheet" href="./src/styles/globals.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
