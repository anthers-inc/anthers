<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anthers</title>
    <!-- Apply the saved light/dark choice before first paint. Default light (set on <html>);
         override to dark if stored. Key + default mirror packages/web-shared/src/lib/theme.ts. -->
    <script>
      try {
        if (localStorage.getItem("anthers_theme") === "dark")
          document.documentElement.setAttribute("data-theme", "dark");
      } catch {}
    </script>
    <!-- Self-hosted, deliberately: loading these from fonts.googleapis.com sent every
         visitor's IP, user-agent and referer to Google on first paint, before any
         consent could exist. See public/fonts/THIRD-PARTY.md.

         Why an inline @import and not a <link>: the bundler resolves every <link
         rel="stylesheet"> href and every url() in the CSS it reaches, and it inlines
         webfonts as base64 — which collapses all 83 subset cuts into one
         render-blocking 4.5 MB chunk and throws away the unicode-range split that
         keeps a latin-only visitor from downloading the cyrillic and vietnamese
         ones. An inline @import passes through untouched, so public/fonts/ stays
         plain static files in both dev and prod. `external` fixes only the
         production build; the dev server reads no such config and still fails to
         resolve. -->
    <style>
      @import "/fonts/fonts.css";
    </style>
    <!-- The tab icon. Referenced straight out of @anthers/brand rather than copied into
         public/: Bun's HTML bundler resolves a rel="icon" href the same way it resolves a
         stylesheet, emitting a content-hashed file and rewriting this to a root-absolute
         URL — so the marks package stays the single home for the marks, which is the whole
         point of packages/brand holding them. A second copy under public/ would be the
         byte-identical-duplicate problem the brand split was done to remove.

         The FLAT-GREEN silhouette is the deliberate pick, not the full-colour mark: the
         lily-and-bee has petal veins and gold stamens that turn to mush at 16px, and the
         marks README names this file and the favicon PNGs as the small-size cuts. The PNG
         is a fallback for browsers that don't take an SVG icon, and the browser picks
         whichever it supports rather than fetching both. -->
    <link rel="icon" type="image/svg+xml" href="../../packages/brand/marks/anthers-mark-flat-green.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../packages/brand/marks/export/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../../packages/brand/marks/export/apple-touch-icon-180.png" />
    <link rel="stylesheet" href="./src/styles/globals.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
