# Local dev Postgres for the Anthers hub. Production uses DigitalOcean Managed
# Postgres; this container is the zero-setup local equivalent (the hub no longer
# runs on a bare SQLite file, so dev now needs a Postgres). SQLite remains the
# engine for the future creator-node role, not the hub.
#
#   make db-up      # start (detached)
#   make db-down    # stop, keep data
#   docker compose down -v   # stop and wipe the data volume
services:
  postgres:
    image: postgres:16
    container_name: anthers-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: anthers
      POSTGRES_PASSWORD: anthers
      POSTGRES_DB: anthers
    ports:
      - "5432:5432"
    volumes:
      - anthers-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anthers -d anthers"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  anthers-pg-data:
