services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bluebell-backend-green
    restart: unless-stopped
    env_file: .env
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bluebell

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bluebell-celery-green
    restart: unless-stopped
    env_file: .env
    command: celery -A _django worker --loglevel=info --concurrency=2
    volumes:
      - media_data:/app/media
    networks:
      - bluebell

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bluebell-frontend-green
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3001"
      BUILD_MODE: prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bluebell

volumes:
  media_data:
    external: true
    name: bluebell_media_data

networks:
  bluebell:
    external: true
    name: bluebell_bluebell
